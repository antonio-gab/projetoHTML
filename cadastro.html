
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <main class="cadastro-container">

        <!-- Cabeçalho -->
        <header class="cabecalho">

            <div class="icone-cadastro">
                <span>👤</span>
            </div>

            <h1>CRIAR CONTA</h1>

            <p>Preencha seus dados para realizar seu cadastro.</p>

        </header>


        <!-- Formulário -->
        <form class="form-cadastro">

            <!-- Dados pessoais -->
            <section class="form-section">

                <h2>Dados Pessoais</h2>

                <div class="campo">

                    <label for="nome">
                        Nome Completo:<span>*</span>
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        placeholder="Digite seu nome completo"
                    >

                </div>


                <div class="campo">

                    <label for="nascimento">
                        Data de Nascimento:<span>*</span>
                    </label>

                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="cpf">
                        CPF:<span>*</span>
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        required
                        placeholder="Digite seu CPF"
                    >

                </div>

            </section>


            <!-- Dados de contato -->
            <section class="form-section">

                <h2>Dados de Contato</h2>

                <div class="campo">

                    <label for="email">
                        E-mail:<span>*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="Digite seu e-mail"
                    >

                </div>


                <div class="campo">

                    <label for="telefone">
                        Telefone:<span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        required
                        placeholder="Digite seu telefone"
                    >

                </div>

            </section>


            <!-- Dados de acesso -->
            <section class="form-section">

                <h2>Dados de Acesso</h2>

                <div class="campo">

                    <label for="senha">
                        Criar Senha:<span>*</span>
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                        placeholder="Crie uma senha"
                    >

                </div>


                <div class="campo">

                    <label for="confirmar-senha">
                        Confirmar Senha:<span>*</span>
                    </label>

                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        required
                        placeholder="Digite sua senha novamente"
                    >

                </div>

            </section>


            <!-- Termos -->
            <div class="termos">

                <input
                    type="checkbox"
                    id="termos"
                    name="termos"
                    required
                >

                <label for="termos">
                    Li e aceito os termos de uso.
                </label>

            </div>


            <!-- Botão -->
            <button type="submit" class="btn-cadastro">
                CADASTRAR
            </button>


            <!-- Link para login -->
            <div class="login-link">

                <p>Já possui uma conta?</p>

                <a href="PaginaPrincipal.html">
                    Fazer Login
                </a>

            </div>

        </form>

    </main>

</body>
</html>
