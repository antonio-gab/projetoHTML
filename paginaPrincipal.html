
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <!-- LADO ESQUERDO -->
        <section class="login-banner">

            <div class="circle circle-top"></div>
            <div class="circle circle-bottom"></div>

            <div class="illustration">

                <div class="monitor">
                    <div class="monitor-screen">

                        <div class="lock">
                            <div class="lock-handle"></div>
                            <div class="lock-body"></div>
                        </div>

                        <div class="fake-input"></div>
                        <div class="fake-input short"></div>

                        <div class="stars">
                            ★ ★ ★ ★
                        </div>

                    </div>

                    <div class="monitor-base"></div>
                </div>

                <div class="person">
                    <div class="person-head"></div>
                    <div class="person-body"></div>
                    <div class="person-leg left"></div>
                    <div class="person-leg right"></div>
                </div>

            </div>

            <div class="banner-text">
                <h1>Bem-vindo!</h1>
                <p>Acesse sua conta e aproveite nossa plataforma.</p>
            </div>

        </section>

        <!-- LADO DIREITO -->
        <section class="login-content">

            <div class="login-box">

                <div class="user-icon">
                    <div class="user-head"></div>
                    <div class="user-body"></div>
                </div>

                <h2>USER LOGIN</h2>

                <p class="subtitle">
                    Entre com seus dados para continuar
                </p>

                <!-- FORMULÁRIO DE LOGIN -->
                <form id="login-form">

                    <div class="input-group">
                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="DIGITE SEU CPF"
                            required
                        >
                        <span class="input-icon">♙</span>
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="DIGITE SUA SENHA"
                            required
                        >
                        <span class="input-icon">🔒</span>
                    </div>

                    <div class="options">

                        <label class="remember">
                            <input type="checkbox" id="lembrar">
                            <span>Lembrar senha</span>
                        </label>

                        <a href="esqueceuSenha.html">
                            Esqueceu a senha?
                        </a>

                    </div>

                    <button type="submit" class="btn-login">
                        ENTRAR
                    </button>

                </form>

                <!-- LINK PARA CADASTRO -->
                <div class="cadastro-link">
                    <p>Não possui uma conta?</p>
                    <a href="cadastro.html">Cadastrar-se</a>
                </div>

                <!-- RODAPÉ -->
                <p class="footer-text">
                    Sistema de acesso
                </p>

            </div>

        </section>

    </main>

    <script>
        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();
            window.location.href = "PaginaDeAgendamento.html";
        });
    </script>

</body>
</html>
